name: Deploy to Mini

# Deploys the shade executable published by `Build & Release` to the mini
# Mac (NangMini) via its self-hosted runner: pull the artifact, swap it into
# place, kickstart the launchd services. Provisioning (plists, env files) is
# done once on the machine with `./shade deploy` — this workflow only updates
# the executable and the brewery CLI (~/bin/brewery).

on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-mini:
    runs-on: [self-hosted, macOS, mini]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # The runner's launchd environment has neither Homebrew nor bun on PATH.
      - name: Add Homebrew and bun to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Download executable from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest --repo ${{ github.repository }} --pattern 'shade-darwin-arm64' --dir "$RUNNER_TEMP" --clobber

      - name: Swap executable and restart services
        run: ./shade update "$RUNNER_TEMP/shade-darwin-arm64"

      - name: Install brewery
        working-directory: tools/brewery
        run: |
          bun install --frozen-lockfile
          bun run compile
          mkdir -p "$HOME/bin"
          install -m 755 brewery "$HOME/bin/brewery"
          "$HOME/bin/brewery" --help >/dev/null
          echo "Installed $HOME/bin/brewery"

      - name: Health check
        run: |
          sleep 5
          curl -sf --max-time 5 http://localhost:4020/health
          curl -sf --max-time 5 http://localhost:4021/health
          echo "Mini deploy healthy"

      - name: Notify Slack on success
        if: success()
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl -sf -X POST '${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}' \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Shade deployed to mini :computer:\\n\`${SHORT_SHA}\`\"}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST '${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}' \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Shade mini deploy failed :x: — <${RUN_URL}|View logs>\"}"
