name: Build & Release

# Builds the shade single-file executable (backend, worker, and edge agents in
# one bun-compiled binary, selected at runtime via SHADE_SERVICE) for each
# deploy platform and publishes them to the `latest` GitHub release. Deploy
# workflows (deploy-studio.yml) pull the artifact and restart services.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "packages/**"
      - "shade"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build executables
        run: |
          bun build backend/src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/shade-darwin-arm64
          bun build backend/src/index.ts --compile --target=bun-linux-x64 --outfile dist/shade-linux-x64

      - name: Upload executables to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            dist/shade-darwin-arm64
            dist/shade-linux-x64
          prerelease: false
          make_latest: true
          body: |
            Automated build from ${{ github.sha }}
