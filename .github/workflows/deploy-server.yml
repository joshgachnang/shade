name: Deploy to Server

# Source-based deploy to the shade host: pulls origin/master on /opt/shade/src,
# runs `bun install`, and restarts the systemd service (which executes
# `bun run src/index.ts`). For the mini deploy see deploy-mini.yml.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "packages/**"
      - "shade"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull master and restart
        run: |
          set -euo pipefail
          cd /opt/shade/src
          git fetch origin master
          git reset --hard origin/master
          /home/josh/.bun/bin/bun install
          sudo systemctl restart shade-backend
          sleep 3
          systemctl is-active shade-backend
          echo "Deploy complete"

      - name: Notify Slack on success
        if: success()
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          REPO="${{ github.repository }}"
          curl -sf -X POST '${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}' \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Shade backend deployed successfully :rocket:\\n\`${SHORT_SHA}\` ${COMMIT_MSG}\\nhttps://github.com/${REPO}/commit/${COMMIT_SHA}\"}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST '${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}' \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Shade backend deploy failed :x:\\n\`${SHORT_SHA}\` — <${RUN_URL}|View logs>\"}"
